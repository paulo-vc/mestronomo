name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    # Windows: o app, o capturador (WASAPI) e o backup (tar.exe) são do Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Os testes rodam no Node; o binário do Electron não é necessário aqui.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dependências
        run: npm ci

      - name: ffmpeg (testes de decodificação)
        # O ffmpeg.exe do Chocolatey no PATH é um "shim" que abre o ffmpeg de verdade como filho:
        # encerrar o shim deixa o filho vivo (e, com -stream_loop -1, segurando o arquivo para sempre).
        # Por isso a pasta do binário real vai na frente do PATH.
        run: |
          choco install ffmpeg -y --no-progress
          $real = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $real) { throw 'ffmpeg real não encontrado' }
          $real.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $real.FullName -hide_banner -version | Select-Object -First 1

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Capturador (Rust)
        run: cargo build --release --manifest-path capture/Cargo.toml
